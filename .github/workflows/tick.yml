name: tick

on:
  schedule:
    # Off the top-of-hour — GitHub throttles :00 crons hardest. Still ~10-min.
    - cron: '3,13,23,33,43,53 13-20 * * 1-5'
  workflow_dispatch:
  # Fired by the Cloudflare Worker cron (reliable scheduling backstop).
  repository_dispatch:
    types: [tick]

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply approve/reject decisions
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}
        run: python -m scripts.apply_decisions

      - name: Poll positions
        env:
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STARTING_CAPITAL: ${{ secrets.STARTING_CAPITAL }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          DECISION_SECRET: ${{ secrets.DECISION_SECRET }}
          DECIDE_BASE_URL: ${{ secrets.DECIDE_BASE_URL }}
        run: python -m scripts.poll

      - name: AI decide
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}
        run: python -m scripts.ai_decide

      - name: Build ledger
        env:
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STARTING_CAPITAL: ${{ secrets.STARTING_CAPITAL }}
        run: python -m scripts.build_ledger

      - name: Sync trades from ledger
        run: python -m scripts.sync_trades

      - name: Track paper trades
        env:
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: python -m scripts.paper_trades

      - name: Summary (conditional)
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          STARTING_CAPITAL: ${{ secrets.STARTING_CAPITAL }}
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [[ "$HOUR" =~ ^(14|16|18|20)$ ]] && [ "$((10#$MIN))" -lt 8 ]; then
            echo "Firing scheduled summary (hour=$HOUR min=$MIN UTC)"
            python -m scripts.summary
          else
            echo "Skipping summary (hour=$HOUR min=$MIN UTC, not in window)"
          fi

      - name: Commit ledger changes
        run: |
          git config user.name "theta-bot"
          git config user.email "bot@theta-engine"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: bot tick $(date -u +%Y-%m-%dT%H:%MZ)"
            # Push, surviving BOTH a moved ref and genuine conflicts in regenerated
            # data files (paper/book.json etc. when scan & tick race): replay our
            # commit on the latest main, auto-resolving any conflict in favor of
            # THIS run's fresh files (-X theirs), and ALWAYS abort a failed rebase
            # so the next retry starts clean (the old loop got stuck on conflicts).
            pushed=0
            for i in 1 2 3 4 5; do
              git fetch -q origin main || true
              if git rebase -X theirs origin/main && git push origin HEAD:main; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $i failed — retrying"; sleep $((RANDOM % 4 + 3))
            done
            [ "$pushed" = "1" ] || { echo "push failed after retries"; exit 1; }
          fi

      - name: Notify on failure
        if: failure()
        run: |
          curl -s --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=theta-engine tick FAILED" \
            --form-string "message=Tick at $(date -u +%H:%MZ) failed. Check actions log." \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json
