name: Position News Scan

on:
  schedule:
    # Hourly from 12:00 to 22:00 UTC = 8 AM - 6 PM ET (covers pre-market through after-hours)
    - cron: "0 12-22 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Run position news scan
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: python -m scripts.position_news

      - name: Commit state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ news/ || true
          if git diff --staged --quiet; then
            echo "No position-news changes"
          else
            git commit -m "Position news $(date +%Y-%m-%d_%H%M)"
            # Push, surviving moved-ref AND data-file conflicts: replay on latest
            # main, auto-resolve conflicts to THIS run's files (-X theirs), and
            # always abort a failed rebase so the next retry starts clean.
            pushed=0
            for i in 1 2 3 4 5; do
              git fetch -q origin main || true
              if git rebase -X theirs origin/main && git push origin HEAD:main; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $i failed — retrying"; sleep $((RANDOM % 4 + 3))
            done
            [ "$pushed" = "1" ] || { echo "push failed after retries"; exit 1; }
          fi
