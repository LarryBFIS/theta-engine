name: Position News Scan

on:
  schedule:
    # Hourly from 12:00 to 22:00 UTC = 8 AM - 6 PM ET (covers pre-market through after-hours)
    - cron: "0 12-22 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Run position news scan
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: python -m scripts.position_news

      - name: Commit state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ || true
          git diff --staged --quiet || git commit -m "Position news state $(date +%Y-%m-%d_%H%M)"
          git pull --rebase origin main || true
          git push || true
