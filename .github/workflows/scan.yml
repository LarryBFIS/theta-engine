name: scan

on:
  schedule:
    # Hourly during market hours (13:45-19:45 UTC = 9:45am-3:45pm ET) plus a
    # premarket pass at 12:45 UTC. Off the :00 mark — GitHub throttles those.
    - cron: '45 12-19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan for opportunities
        env:
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          # Phase 4: enables the LLM portfolio-risk review. If unset, the scan
          # runs exactly as before (agent disabled, candidates pass unchanged).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_REVIEW_MODE: ${{ vars.AGENT_REVIEW_MODE }}
        run: python -m scripts.scan_opportunities

      - name: Track paper trades
        env:
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: python -m scripts.paper_trades

      - name: Commit scan results
        run: |
          git config user.name "theta-bot"
          git config user.email "bot@theta-engine"
          git add scan/ paper/ memory/
          if git diff --cached --quiet; then
            echo "No scan changes"
          else
            git commit -m "scan: opportunities $(date -u +%Y-%m-%dT%H:%MZ)"
            # Push, surviving moved-ref AND data-file conflicts: replay on latest
            # main, auto-resolve conflicts to THIS run's files (-X theirs), and
            # always abort a failed rebase so the next retry starts clean.
            pushed=0
            for i in 1 2 3 4 5; do
              git fetch -q origin main || true
              if git rebase -X theirs origin/main && git push origin HEAD:main; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $i failed — retrying"; sleep $((RANDOM % 4 + 3))
            done
            [ "$pushed" = "1" ] || { echo "push failed after retries"; exit 1; }
          fi

      - name: Notify on failure
        if: failure()
        run: |
          curl -s --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=theta-engine SCAN failed" \
            --form-string "message=Scan at $(date -u +%H:%MZ) failed. Check Actions." \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json
