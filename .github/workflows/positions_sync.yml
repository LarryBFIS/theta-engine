name: Positions Sync

on:
  schedule:
    - cron: "2,17,32,47 13-21 * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run positions sync
        run: python -m monitor.positions_sync

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trades.json || true
          git diff --staged --quiet || git commit -m "auto-sync: positions reconciled $(date +%Y-%m-%d_%H%M)"
          git pull --rebase origin main || true
          git push || true
