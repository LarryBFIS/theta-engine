<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>theta-engine — decide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0a; --card:#131313; --border:#222; --fg:#e8e8e8; --dim:#888;
    --cherry:#e63946; --green:#4ade80; --red:#f87171; --amber:#fbbf24;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:'IBM Plex Sans',system-ui,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:2rem 1.25rem 4rem; }
  .brand { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:1.1rem; margin-bottom:1.5rem; }
  .brand .dot { color:var(--cherry); }
  .card { background:var(--card); border:1px solid var(--border); padding:1.25rem; margin-bottom:1.25rem; }
  .label { font-family:'IBM Plex Mono',monospace; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.15em; color:var(--dim); margin-bottom:0.3rem; }
  .val { font-family:'IBM Plex Mono',monospace; font-size:1.1rem; }
  .reason { color:var(--dim); font-size:0.9rem; margin-top:0.75rem; line-height:1.5; }
  .reason li { margin:0.2rem 0; }
  .meta { font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:#555; margin-top:0.75rem; word-break:break-all; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-top:0.5rem; }
  button { font-family:'IBM Plex Mono',monospace; font-size:0.95rem; font-weight:600; padding:1rem; border:1px solid; background:transparent; cursor:pointer; text-transform:uppercase; letter-spacing:0.08em; transition:background 0.15s; }
  .approve { color:var(--green); border-color:var(--green); }
  .approve:hover { background:rgba(74,222,128,0.12); }
  .reject { color:var(--red); border-color:var(--red); }
  .reject:hover { background:rgba(248,113,113,0.12); }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  .result { font-family:'IBM Plex Mono',monospace; font-size:0.95rem; padding:1rem; margin-top:1rem; border:1px solid var(--border); display:none; }
  .result.ok { display:block; color:var(--green); border-color:var(--green); }
  .result.err { display:block; color:var(--amber); border-color:var(--amber); }
  .note { font-size:0.8rem; color:var(--dim); margin-top:1.25rem; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot">●</span> theta-engine · decide</div>

  <div class="card" id="ctx">
    <div class="label">Suggestion</div>
    <div class="val" id="sug-id">—</div>
    <div class="reason" id="sug-detail">Loading suggestion…</div>
    <div class="meta" id="sug-meta"></div>
  </div>

  <div class="btns">
    <button class="approve" id="btn-approve" disabled>Approve</button>
    <button class="reject" id="btn-reject" disabled>Reject</button>
  </div>

  <div class="result" id="result"></div>

  <p class="note">
    <b>Record-only:</b> Approving logs your decision and confirms via Pushover — it does
    <i>not</i> place the order. Execute the close in tastytrade yourself. The next bot
    tick picks up your choice within ~10 minutes.
  </p>
</div>

<script>
  const WORKER_URL = 'https://theta-decide.larry-d18.workers.dev';
  const SUGGESTIONS_URL = 'https://raw.githubusercontent.com/LarryBFIS/theta-engine/main/suggestions.json';

  const params = new URLSearchParams(location.search);
  const id = params.get('id') || '';
  const token = params.get('t') || '';

  const $ = (x) => document.getElementById(x);
  $('sug-id').textContent = id || '(missing id)';

  function setResult(cls, msg) {
    const el = $('result');
    el.className = 'result ' + cls;
    el.textContent = msg;
  }

  // Show suggestion context (best-effort; buttons work regardless).
  (async () => {
    if (!id || !token) {
      $('sug-detail').textContent = 'Invalid link — missing id or signature.';
      return;
    }
    try {
      const res = await fetch(SUGGESTIONS_URL + '?_=' + Date.now(), { cache: 'no-store' });
      const data = await res.json();
      const s = (data.suggestions || []).find((x) => x.id === id);
      if (s) {
        const reasons = Array.isArray(s.reasoning) ? s.reasoning : [s.reasoning].filter(Boolean);
        $('sug-detail').innerHTML =
          '<b>' + (s.trade_id || '') + '</b> · ' + (s.action || '') +
          (s.urgency ? ' · ' + s.urgency : '') +
          (reasons.length ? '<ul>' + reasons.map((r) => '<li>' + r + '</li>').join('') + '</ul>' : '');
        if (s.status && s.status !== 'pending') {
          setResult('ok', 'Already ' + s.status + '.');
        }
      } else {
        $('sug-detail').textContent = 'Suggestion not found in ledger yet (it may still be propagating).';
      }
    } catch (e) {
      $('sug-detail').textContent = 'Could not load suggestion context.';
    }
    $('btn-approve').disabled = false;
    $('btn-reject').disabled = false;
  })();

  async function decide(action) {
    $('btn-approve').disabled = true;
    $('btn-reject').disabled = true;
    setResult('ok', 'Submitting ' + action + '…');
    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, t: token, action }),
      });
      const out = await res.json();
      if (res.ok && out.ok) {
        setResult('ok', '✓ ' + action.toUpperCase() + ' recorded. The next tick will confirm via Pushover.');
      } else {
        setResult('err', '⚠ ' + (out.error || ('HTTP ' + res.status)));
        $('btn-approve').disabled = false;
        $('btn-reject').disabled = false;
      }
    } catch (e) {
      setResult('err', '⚠ Network error: ' + e.message);
      $('btn-approve').disabled = false;
      $('btn-reject').disabled = false;
    }
  }

  $('btn-approve').addEventListener('click', () => decide('accept'));
  $('btn-reject').addEventListener('click', () => decide('reject'));
</script>
</body>
</html>
